project_id = "nmkneyzyxxhebkurgimh"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**", "https://desenrola-facil-painel.onrender.com/**"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.rate_limit]
email_sent = 2

[analytics]
enabled = false


[functions.api]
verify_jwt = true
import_map = "./functions/api/deno.json"

[functions.bootstrap-owner]
verify_jwt = true
import_map = "./functions/bootstrap-owner/deno.json"

# Provider callbacks authenticate through Meta HMAC or the dedicated Asaas
# webhook token, not Supabase user JWTs. No provider secrets are committed.
[functions.meta-webhook]
verify_jwt = false
import_map = "./functions/meta-webhook/deno.json"

[functions.meta-instagram-oauth-start]
verify_jwt = true
import_map = "./functions/meta-instagram-oauth-start/deno.json"

[functions.meta-instagram-oauth-callback]
verify_jwt = false
import_map = "./functions/meta-instagram-oauth-callback/deno.json"

[functions.meta-instagram-admin]
verify_jwt = true
import_map = "./functions/meta-instagram-admin/deno.json"

[functions.meta-business-oauth-start]
verify_jwt = true
import_map = "./functions/meta-business-oauth-start/deno.json"

[functions.meta-business-oauth-callback]
verify_jwt = false
import_map = "./functions/meta-business-oauth-callback/deno.json"

[functions.asaas-webhook]
verify_jwt = false
import_map = "./functions/asaas-webhook/deno.json"

[functions.payments]
verify_jwt = true
import_map = "./functions/payments/deno.json"

# Public sales-page intake validates the origin, payload, consent, honeypot,
# and per-IP request rate before using a server-side service credential.
[functions.lead-intake]
verify_jwt = false
import_map = "./functions/lead-intake/deno.json"

# Public sales-page assistant. Origin allowlist, explicit AI notice, request
# limits, and provider credentials are checked inside the Edge Function.
[functions.site-chat]
verify_jwt = false
import_map = "./functions/site-chat/deno.json"
